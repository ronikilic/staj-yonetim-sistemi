version: "3.9"

services:

  postgres:
    image: postgres:17
    container_name: staj_postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: staj_sistemi

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: staj_redis

    restart: always

    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: staj_rabbitmq

    restart: always

    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: 1234

    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data: